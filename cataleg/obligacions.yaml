# Catàleg d'obligacions de remissió d'informació — Ajuntament de la Torre de l'Espanyol
# (641 h · règim comú · NO model de cessió · tutela financera: Generalitat de Catalunya)
#
# Fonts verificades el 24/09/2026:
#  - OM HAP/2105/2012, text consolidat BOE (darrera actualització 26/12/2025; inclou l'OM HAC/1518/2025,
#    en vigor l'1/1/2026): arts. 4, 5, 6, 9, 15, 16, 17, 19.
#  - Ordre ECF/138/2007 (text consolidat, Departament d'Economia): arts. 4, 5, 10, 11, 12, 13.
#  - Nota informativa DGPFAT sobre el règim de tutela financera 2026 (28/01/2026).
#  - Web «Hisendes locals» de la Generalitat (pressupost i liquidació a Presidència; estat del deute; Sindicatura).
#  - TRLRHL arts. 169, 191, 193, 212 i 218; RD 424/2017 art. 37; LOEPSF arts. 23 i 27.
#
# CRITERI DE DATES: quan la norma diu «abans del dia X» (`abans_de: true`), la data límit que
# calcula el sistema és el dia anterior a X (criteri conservador). Així una alerta mai arriba tard.
#
# Tipus de termini:
#   anual:        {mes, dia, offset_any}  → venciment = (periode + offset_any)-mes-dia
#   trimestral:   {trimestres: [..]}      → darrer dia del mes següent al final del trimestre
#   esdeveniment: {event, dies | mesos | dia_mes_seguent} → a partir de la data d'un fet de l'expedient
# `aplica`: condicions sobre l'entitat (poblacio_max, poblacio_min, model_cessio, tutela) o `condicional: true`
# (només s'activa si hi ha l'esdeveniment o la ho marques).

# ═════════════════════════════ ESTAT · Ministeri d'Hisenda ═════════════════════════════
# Canal comú: Oficina Virtual de Coordinació Financera amb les Entitats Locals (autoritza la Intervenció,
# art. 4.1.b OM), amb signatura electrònica (art. 5 OM).

MIN_PLANS_MIG_TERMINI:
  nom: Plans pressupostaris a mitjà termini (marcs pressupostaris)
  titol_periode: "Plans {p1}-{p3}"
  organisme: Ministeri d'Hisenda
  ambit: estatal
  canal: Oficina Virtual EELL (Ministeri d'Hisenda)
  fonament: "art. 6 OM HAP/2105/2012; art. 29 LOEPSF"
  text_termini: "Abans del 15 de març de cada any"
  termini: {tipus: anual, mes: 3, dia: 15, offset_any: 0, abans_de: true}
  contingut:
    - Plans pressupostaris dels tres exercicis següents, amb els pasius contingents (redacció OM HAC/1518/2025)
  consequencies: "art. 19 OM: requeriment (≤ 15 dies naturals) i, si no s'atén, publicitat i mesures automàtiques de l'art. 20 LOEPSF"
  confianca: alta

